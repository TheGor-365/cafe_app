      - name: Build real Webpacker 4.3 Rails test packs in CI only
        shell: bash
        env:
          RAILS_ENV: test
          NODE_ENV: development
          NODE_OPTIONS: --max-old-space-size=2048
        run: |
          set -euo pipefail
          ./node_modules/.bin/webpack --config config/webpack/test.js
          echo 'P1.4 REAL WEBPACKER BUILD COMPLETED'
      - name: Verify actual test manifest resolves non-empty generated JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const fs = require('fs');
          const path = require('path');
          const m = JSON.parse(fs.readFileSync('public/packs-test/manifest.json','utf8'));
          const entry=m['application.js'];
          if(typeof entry!=='string' || !/^\/packs-test\/js\/application-[a-z0-9]+\.js$/.test(entry)) {
            throw Error('No genuine fingerprinted Webpacker application.js entry in test manifest');
          }
          const relative=entry.slice('/packs-test/'.length);
          const root=path.resolve('public/packs-test');
          const file=path.resolve(root,relative);
          if (!file.startsWith(root + path.sep)) throw Error('Unsafe JS manifest traversal');
          if (fs.statSync(file).size<1000) throw Error('Missing or empty actual compiled JS');
          if (fs.readFileSync(file,'utf8').includes('P1.4 disposable, NON-FUNCTIONAL frontend pack')) {
            throw Error('Fake P1.4 JS placeholder instead of real Webpacker bundle');
          }
          console.log('P1.4 GENUINE WEBPACKER TEST MANIFEST AND NONEMPTY COMPILED JS PASS');
          JS
