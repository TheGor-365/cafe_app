                      'set -eu; bundle exec rails runner qa/security/cafe_p14_fifth_http_fault_diagnostic_20261107.rb']
          args=MockOld().command(None,None,None,None,None,'7532669441155230666',None)
          old='bundle exec rails runner qa/security/cafe_p14_fifth_http_fault_diagnostic_20261107.rb'
          new='bundle exec rails runner qa/security/cafe_p14_fifth_view_error_cause_20261107.rb'
