          import importlib.util
          p=Path('scripts/cafe_p14_fifth_view_error_cause_20261107.py')
          s=importlib.util.spec_from_file_location('cafe_p14_view_ci',p)
          m=importlib.util.module_from_spec(s);s.loader.exec_module(m)
          class MockOld:
