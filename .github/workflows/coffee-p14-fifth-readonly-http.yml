          assert mod.SOURCE_SHA=='dc5dacb9d79b9d7a8951ebcd0b74b489933d53cd'
          def zip_data(entries,link=False):
              buf=io.BytesIO()
              with zipfile.ZipFile(buf,'w',compression=zipfile.ZIP_DEFLATED) as z:
                  for name,content in entries:
                      if link and name=='js/application-abc123.js':
                          i=zipfile.ZipInfo(name)
                          i.create_system=3
                          i.external_attr=(stat.S_IFLNK|0o777)<<16
                          z.writestr(i,content)
                      else:z.writestr(name,content)
              return buf.getvalue()
          base=[('manifest.json',json.dumps(
