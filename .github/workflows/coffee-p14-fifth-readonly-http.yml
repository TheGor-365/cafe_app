          assert prefix=='' and len(files)==2
          assert entry=='/packs-test/js/application-abc123.js'
          with tempfile.TemporaryDirectory(prefix='cafe-p14-ci-artifact-') as t:
              archive=Path(t)/'cafe-p14-fifth-real-packs-test.zip'
              archive.write_bytes(good)
