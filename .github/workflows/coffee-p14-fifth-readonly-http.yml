          python3 - <<'PY'
          from pathlib import Path
          py=Path('scripts/cafe_p14_fifth_view_error_cause_20261107.py').read_text()
          rb=Path('qa/security/cafe_p14_fifth_view_error_cause_20261107.rb').read_text()
