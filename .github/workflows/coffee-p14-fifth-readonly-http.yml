          assert "P1.4 VIEW DIAG PACK_MANIFEST=" in rb
          assert "P1.4 VIEW DIAG NODE_MODULES=" in rb
          assert 'browser.get(path' in rb and 'session.get(path' in rb
          for bad in ('browser.post(', 'session.post(', 'browser.patch(', 'session.patch(',
