                      'puts error.message','puts error.backtrace','print(error.message)',
                      'db:schema:load','db:seed','db:prepare'):
            assert bad not in rb,bad
          print('P1.4 NO DB WRITE / REAL GET-ONLY / NO RAW ERRORS PASS')
