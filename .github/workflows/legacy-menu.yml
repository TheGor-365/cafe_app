name: Cafe menu query regression

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  menu:
    if: github.head_ref == 'feature/cafe-menu-search-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: ruby:2.5.8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: cafe_ci_only
          POSTGRES_DB: cafe_test
        options: >-
          --health-cmd "pg_isready -U postgres -d cafe_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      RAILS_ENV: test
      RUBYOPT: -rlogger
      DATABASE_URL: postgres://postgres:cafe_ci_only@postgres:5432/cafe_test
      BUNDLE_PATH: /tmp/cafe-bundle
    steps:
      - uses: actions/checkout@v4
      - name: Install Bundler
        run: gem install bundler -v 2.2.13 --no-document
      - name: Linux lockfile platform in runner only
        run: bundle _2.2.13_ lock --add-platform x86_64-linux
      - name: Install dependencies
        run: bundle _2.2.13_ install --jobs 2 --retry 2
      - name: Prepare test schema
        run: bundle _2.2.13_ exec rails db:schema:load
      # Only server request/render behavior is tested here; real JS compilation
      # remains a separate acceptance gate on the legacy Webpacker stack.
      - name: Provide test-only pack manifest
        run: |
          mkdir -p public/packs-test
          printf '%s\n' '{"application.js":"/packs-test/js/application-test.js","application.css":"/packs-test/css/application-test.css"}' > public/packs-test/manifest.json
      - name: Test menu requests
        run: bundle _2.2.13_ exec rails test test/controllers/menu_controller_test.rb
