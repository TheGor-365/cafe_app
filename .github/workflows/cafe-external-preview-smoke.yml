name: Cafe external open-showcase HTTP smoke
on:
  push:
    branches:
      - qa/cafe-preview-http-smoke-20261108
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify public routes, favicon, health, and admin isolation without secrets
        shell: bash
        run: |
          set -euo pipefail
          url='https://cafe-web-preview.up.railway.app'
          success=0
          for attempt in $(seq 1 45); do
            status="$(curl -sS --max-time 15 -D /tmp/cafe-home-headers -o /tmp/cafe-home-body -w '%{http_code}' "$url/" || true)"
            echo "public storefront attempt=$attempt status=$status"
            if [[ "$status" == '200' ]] &&
               grep -Fq 'href="/users/sign_in"' /tmp/cafe-home-body &&
               grep -Fq 'href="/users/sign_up"' /tmp/cafe-home-body &&
               ! grep -Fq 'Preview access password' /tmp/cafe-home-body; then
              success=1
              break
            fi
            sleep 8
          done
          [[ "$success" == '1' ]] || { echo 'FAIL: public storefront still gated'; exit 1; }

          signin="$(curl -sS --max-time 20 -o /tmp/cafe-signin -w '%{http_code}' "$url/users/sign_in")"
          [[ "$signin" == '200' ]] && grep -Fq 'Sign in' /tmp/cafe-signin ||
            { echo 'FAIL: sign-in form not available'; exit 1; }

          signup="$(curl -sS --max-time 20 -o /tmp/cafe-signup -w '%{http_code}' "$url/users/sign_up")"
          [[ "$signup" == '200' ]] && grep -Fq 'Create an account' /tmp/cafe-signup ||
            { echo 'FAIL: sign-up form not available'; exit 1; }

          favstatus="$(curl -sS --max-time 20 -D /tmp/cafe-favicon-headers -o /tmp/cafe-favicon -w '%{http_code}' "$url/favicon.svg?v=20261109")"
          [[ "$favstatus" == '200' ]] &&
            grep -qi '^content-type: image/svg+xml' /tmp/cafe-favicon-headers &&
            grep -Fq '<svg' /tmp/cafe-favicon ||
            { echo 'FAIL: first-party favicon missing or returning HTML'; cat /tmp/cafe-favicon-headers; exit 1; }

          healthstatus="$(curl -sS --max-time 20 -o /tmp/cafe-health -w '%{http_code}' "$url/__cafe_health")"
          [[ "$healthstatus" == '200' ]] && [[ "$(cat /tmp/cafe-health)" == 'ok' ]] ||
            { echo 'FAIL: database healthcheck'; exit 1; }

          for path in /products /categories /admin/demo_orders; do
            status="$(curl -sS --max-time 20 -D /tmp/cafe-protected-headers -o /tmp/cafe-protected-body -w '%{http_code}' "$url$path")"
            [[ "$status" == '302' || "$status" == '303' ]] &&
              grep -qi '^location: .*\/users\/sign_in' /tmp/cafe-protected-headers ||
              { echo "FAIL: anonymous admin route improperly exposed: $path $status"; exit 1; }
          done

          # Confirm public homepage includes the new compact mobile actions and
          # the served production stylesheet contains the final mobile-only rules.
          grep -Fq 'cafe-mobile-account-actions' /tmp/cafe-home-body ||
            { echo 'FAIL: compact account controls absent from HTML'; exit 1; }
          python3 - <<'PY'
          html = open('/tmp/cafe-home-body', encoding='utf-8').read()
          brand = html.find('class="title-card cafe-brandbar"')
          hero = html.find('class="cafe-home"')
          assert brand >= 0 and hero > brand, "Mobile Home title header absent or after hero"
          assert html.count('class="cafe-mobile-account-actions"') == 1, "Mobile account controls duplicated or missing"
          print("PASS: homepage shared brandbar before hero with one account control group")
          PY
          python3 - <<'PY'
          from html.parser import HTMLParser
          from urllib.parse import urljoin
          from urllib.request import urlopen
          class StylesheetParser(HTMLParser):
              hrefs = []
              def handle_starttag(self, tag, attrs):
                  if tag == "link":
                      data = dict(attrs)
                      if "stylesheet" in data.get("rel", ""):
                          self.hrefs.append(data.get("href", ""))
          parser = StylesheetParser()
          parser.feed(open("/tmp/cafe-home-body", encoding="utf-8").read())
          urls = [urljoin("https://cafe-web-preview.up.railway.app/", p) for p in parser.hrefs if "application" in p and ".css" in p]
          assert urls, "No compiled application stylesheet found"
          combined = "\n".join(urlopen(url, timeout=25).read().decode("utf-8") for url in urls)
          assert "cafe-mobile-account-actions" in combined, "Mobile actions not included in production CSS"
          import re
          assert "nav.cafe-account-widget" in combined and re.search(r"display\s*:\s*none\s*!important", combined), "Missing mobile account strip hiding"
          assert ".home-page" in combined and ".cafe-home__hero-content" in combined, "Missing hero-first mobile rules"
          print("PASS: compiled production CSS has new mobile hero-first rules")
          PY

          echo 'PASS: public storefront, Devise auth, favicon, health, admin isolation and mobile CSS. No credentials used.'
