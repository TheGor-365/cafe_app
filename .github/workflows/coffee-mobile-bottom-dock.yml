name: Cafe mobile bottom dock (isolated checks)

on:
  push:
    branches: [feature/cafe-mobile-bottom-dock-20261107]
  pull_request:
    branches: [feature/cafe-ui-account-fixed-backdrop-20261106]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify accessible icon markup and responsive overrides
        run: |
          python3 - <<'PY'
          from pathlib import Path
          layout=Path('app/views/layouts/application.html.erb').read_text()
          markup=Path('app/views/layouts/_mobile_dock.html.erb').read_text()
          css=Path('app/assets/stylesheets/zzzzzzz_cafe_mobile_dock.scss').read_text()
          assert layout.count("render 'layouts/mobile_dock'")==1
          assert "render 'layouts/links'" in layout
          assert markup.count('class="cafe-dock__icon"')==6
          assert "user_signed_in?" in markup and "current_user&.admin?" in markup
          assert 'aria-current' in markup and 'aria-label' in markup
          assert 'position: fixed' in css and 'safe-area-inset-bottom' in css
          assert '@media (max-width: 760px)' in css and '@media (min-width: 761px)' in css
          assert not any(x in markup for x in ('<script', 'javascript:', 'User.create', 'Order.create'))
          print('MOBILE DOCK STATIC PASS')
          PY
      - name: Compile and mock-test fail-closed owner-local layout adapter
        run: |
          python3 -B -m py_compile scripts/cafe_mobile_dock_local_adapter_20261107.py
          python3 -B scripts/cafe_mobile_dock_local_adapter_20261107.py --help
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          import subprocess
          file=Path('scripts/cafe_mobile_dock_local_adapter_20261107.py')
          spec=importlib.util.spec_from_file_location('cafe_dock_owner_gate', file)
          gate=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(gate)
          assert gate.OLD_LAYOUT_SHA=='85ab9031ec6fd13bdefb735588cf46f570daea11'
          assert gate.ASSET_COMMIT=='c415e32eb2ce8288087f5b1d652424fe1c6f51bf'
          assert gate.BRANCH=='feature/cafe-integration-local-20261101'
          assert gate.PARTIAL_SHA==subprocess.check_output(
              ['git','hash-object',str(gate.PARTIAL)],text=True).strip()
          assert gate.CSS_SHA==subprocess.check_output(
              ['git','hash-object',str(gate.CSS)],text=True).strip()
          source=b'\n'.join((
              b'cafe-page cafe-main-content cafe-account-widget',
              b'jquery@3.5.1 bootstrap@4.6.2 avatar&.url(:thumb)',
              b"button_to 'Sign out' stylesheet_pack_tag javascript_pack_tag",
              b"render 'layouts/footer'",
              b'  </body>',
          ))
          gate.OLD_LAYOUT_SHA=gate.git_blob(source)
          updated=gate.patched_layout(source)
          assert updated.count(gate.INSERT)==1
          assert updated.replace(gate.INSERT,b'',1)==source
          for wrong in (source+b'changed',source+gate.ANCHOR,
                        source.replace(gate.ANCHOR,gate.INSERT+gate.ANCHOR)):
              try:
                  gate.patched_layout(wrong)
              except RuntimeError as e:
                  assert str(e).startswith('CAFE MOBILE DOCK STOP:')
              else:
                  raise AssertionError('unsafe local layout passed')
          code=file.read_text()
          assert 'path.open("xb")' in code
          assert 'os.replace(temp, path)' in code
          assert 'private_folder()' in code
          assert 'ASSET_COMMIT' in code and 'git_blob(data) == expected' in code
          assert 'subprocess.run(' in code and '["git", "-C", str(ROOT)' in code
          assert 'docker run' not in code and 'db:schema:load' not in code
          print('CAFE MOBILE DOCK OWNER ADAPTER MOCK + SHA PIN PASS')
          PY

  rails:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ruby:2.5.8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: cafe_ci_only
          POSTGRES_DB: cafe_test
        options: >-
          --health-cmd "pg_isready -U postgres -d cafe_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      RAILS_ENV: test
      RUBYOPT: -rlogger
      DATABASE_URL: postgres://postgres:cafe_ci_only@postgres:5432/cafe_test
      BUNDLE_PATH: /tmp/cafe-bundle
    steps:
      - uses: actions/checkout@v4
      - name: Install legacy bundler
        run: gem install bundler -v 2.2.13 --no-document
      - name: Prepare disposable Linux lockfile and install gems
        run: |
          bundle _2.2.13_ lock --add-platform x86_64-linux
          bundle _2.2.13_ install --jobs 2 --retry 2
      - name: Prepare isolated CI schema and test-only Webpacker stub
        run: |
          bundle _2.2.13_ exec rails db:schema:load
          mkdir -p public/packs-test
          printf '%s\n' '{"application.js":"/packs-test/js/application-test.js","application.css":"/packs-test/css/application-test.css"}' > public/packs-test/manifest.json
      - name: Test mobile bottom dock and existing shell regressions
        run: |
          bundle _2.2.13_ exec rails test \
            test/integration/coffee_mobile_bottom_dock_test.rb \
            test/integration/coffee_mobile_shell_test.rb \
            test/integration/coffee_unified_shell_test.rb
