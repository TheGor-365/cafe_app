name: Cafe Railway Docker build diagnostics
on:
  push:
    branches:
      - diagnostics/cafe-railway-docker-build-20261108
  workflow_dispatch:
jobs:
  docker-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Print non-secret build environment
        run: |
          docker version
          df -h
          free -h
      - name: Reproduce isolated Railway Docker build without secrets
        run: |
          set -o pipefail
          DOCKER_BUILDKIT=1 docker build --progress=plain --no-cache -t cafe-railway-build-probe:local . 2>&1 | tee /tmp/cafe-docker-build.log
      - name: Upload diagnostic build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cafe-docker-build-log
          path: /tmp/cafe-docker-build.log
          if-no-files-found: ignore
          retention-days: 3
