name: Cafe legacy ACL request tests

on:
  pull_request:
    branches:
      - master

concurrency:
  group: cafe-acl-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  acl:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: ruby:2.5.8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: cafe_ci_only
          POSTGRES_DB: cafe_test
        options: >-
          --health-cmd "pg_isready -U postgres -d cafe_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      RAILS_ENV: test
      RUBYOPT: -rlogger
      DATABASE_URL: postgres://postgres:cafe_ci_only@postgres:5432/cafe_test
      BUNDLE_PATH: /tmp/cafe-bundle
    steps:
      - uses: actions/checkout@v4
      - name: Install locked Bundler
        run: gem install bundler -v 2.2.13 --no-document
      - name: Resolve Linux lockfile platform in runner only
        run: bundle _2.2.13_ lock --add-platform x86_64-linux
      - name: Install legacy dependencies
        run: bundle _2.2.13_ install --jobs 2 --retry 2
      - name: Prepare disposable test schema
        run: bundle _2.2.13_ exec rails db:schema:load
      # Controller rendering tests do not exercise Webpack bundles. A temporary
      # test-only manifest isolates Rails HTML/auth behavior from old JS tooling.
      - name: Provide test-only Webpacker manifest (not a JS build)
        run: |
          mkdir -p public/packs-test
          printf '%s\n' '{"application.js":"/packs-test/js/application-test.js","application.css":"/packs-test/css/application-test.css"}' > public/packs-test/manifest.json
      - name: Run ACL negative and admin CRUD positive tests
        run: bundle _2.2.13_ exec rails test test/controllers/admin_access_test.rb test/controllers/products_controller_test.rb test/controllers/categories_controller_test.rb
