name: Cafe legacy cart model tests

on:
  push:
    branches:
      - feature/cafe-cart-total-20261101
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  cart:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: ruby:2.5.8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: cafe_ci_only
          POSTGRES_DB: cafe_test
        options: >-
          --health-cmd "pg_isready -U postgres -d cafe_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      RAILS_ENV: test
      RUBYOPT: -rlogger
      DATABASE_URL: postgres://postgres:cafe_ci_only@postgres:5432/cafe_test
      BUNDLE_PATH: /tmp/cafe-bundle
    steps:
      - uses: actions/checkout@v4
      - name: Install locked Bundler
        run: gem install bundler -v 2.2.13 --no-document
      - name: Resolve Linux lockfile platform in runner only
        run: bundle _2.2.13_ lock --add-platform x86_64-linux
      - name: Install legacy dependencies
        run: bundle _2.2.13_ install --jobs 2 --retry 2
      - name: Prepare disposable test schema
        run: bundle _2.2.13_ exec rails db:schema:load
      - name: Run cart model and request regression tests
        run: bundle _2.2.13_ exec rails test test/models/order_item_test.rb test/controllers/order_items_requests_test.rb
